# higgsfield2api HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 已指向本机），自动续期并 reload nginx。
#
# 入口层不做认证 —— 鉴权在服务侧 SERVICE_TOKEN（Bearer / X-Api-Key）。
limit_req_zone $binary_remote_addr zone=hf2api:10m rate=300r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name higgsfield2api.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/higgsfield2api.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/higgsfield2api.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/higgsfield2api.1task.cn.log;
    error_log  /www/wwwlogs/higgsfield2api.1task.cn.error.log;

    auth_basic off;

    location / {
        # 洪水闸门（不是鉴权）：单机任务台账，别让扫描器打满
        limit_req zone=hf2api burst=60 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/higgsfield2api-proxy.inc;
    }
}
